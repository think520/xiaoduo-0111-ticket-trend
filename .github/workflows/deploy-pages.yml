name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成静态站点（Dashboard 作为首页）
        run: |
          mkdir -p _site
          cp output/dashboard.html _site/index.html
          mkdir -p _site/charts
          cp output/charts/*.svg _site/charts/
          cp "output/趋势分析报告.md" _site/report.md
          cp README.md _site/README.md
          mkdir -p _site/docs _site/examples
          cp docs/*.md _site/docs/
          cp examples/* _site/examples/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
